name: Deploy to Google Play

'on':
  push:
    branches:
      - master
    paths:
      - 'app/build.gradle'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      force_deploy:
        description: 'Force deploy even if versionCode was not bumped'
        required: false
        default: false
        type: boolean

concurrency:
  group: play-store-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.version_check.outputs.should_deploy }}
      version_code: ${{ steps.version_check.outputs.version_code }}
      version_name: ${{ steps.version_check.outputs.version_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version Update
        id: version_check
        shell: python
        run: |
          import os, sys, re, subprocess

          event_name = "${{ github.event_name }}"
          force_deploy_input = "${{ github.event.inputs.force_deploy }}"
          force_deploy = force_deploy_input.lower() == "true"

          with open("app/build.gradle", "r") as f:
              content = f.read()

          vc_match = re.search(r'versionCode\s+(\d+)', content)
          vn_match = re.search(r'versionName\s+["\']([^"\']+)["\']', content)

          if not vc_match or not vn_match:
              print("::error::Could not extract versionCode or versionName from app/build.gradle")
              sys.exit(1)

          curr_vc = int(vc_match.group(1))
          curr_vn = vn_match.group(1)

          print(f"Current versionCode: {curr_vc}")
          print(f"Current versionName: {curr_vn}")

          should_deploy = False

          if force_deploy:
              print("Force deploy requested. Proceeding with deployment.")
              should_deploy = True
          elif event_name == "workflow_dispatch":
              print("Manual workflow trigger. Proceeding with deployment.")
              should_deploy = True
          else:
              # Push event: compare with the commit before the push
              before_sha = "${{ github.event.before }}"
              if not before_sha or re.match(r'^0+$', before_sha):
                  before_ref = "HEAD~1"
              else:
                  before_ref = before_sha

              try:
                  prev_content = subprocess.check_output(
                      ["git", "show", f"{before_ref}:app/build.gradle"],
                      stderr=subprocess.DEVNULL
                  ).decode("utf-8")
                  prev_vc_match = re.search(r'versionCode\s+(\d+)', prev_content)
                  prev_vc = int(prev_vc_match.group(1)) if prev_vc_match else 0
              except Exception as e:
                  print(f"Could not read previous app/build.gradle from {before_ref}: {e}")
                  prev_vc = 0

              print(f"Previous versionCode: {prev_vc}")

              if curr_vc > prev_vc:
                  print(f"Version bump detected ({prev_vc} -> {curr_vc}). Triggering Play Store release!")
                  should_deploy = True
              else:
                  print(f"No versionCode increase detected ({curr_vc} <= {prev_vc}). Skipping Play Store release.")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as gh_out:
                  gh_out.write(f"should_deploy={'true' if should_deploy else 'false'}\n")
                  gh_out.write(f"version_code={curr_vc}\n")
                  gh_out.write(f"version_name={curr_vn}\n")

  build-and-publish:
    name: Build & Publish to Play Store
    needs: check-version
    if: needs.check-version.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.PLAY_KEYSTORE_BASE64 }}" ]; then
            echo "::error::PLAY_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.jks"
          echo "keystore_path=${{ runner.temp }}/release.jks" >> $GITHUB_OUTPUT

      - name: Build Signed Release App Bundle (.aab)
        env:
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.jks"

      - name: Upload Bundle Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ needs.check-version.outputs.version_name }}-b${{ needs.check-version.outputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.himanshurawat.notesapp
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: false

      - name: Create Git Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version_name }}
          name: Release v${{ needs.check-version.outputs.version_name }} (Build ${{ needs.check-version.outputs.version_code }})
          body: |
            Automated Google Play Store Release
            - **Version Name:** ${{ needs.check-version.outputs.version_name }}
            - **Version Code:** ${{ needs.check-version.outputs.version_code }}
            - **Track:** ${{ github.event.inputs.track || 'internal' }}
            - **Status:** ${{ github.event.inputs.status || 'completed' }}
          files: app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
